name: ctfzone

services:
  caddy:
    image: caddy:2.11.4@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?Set CADDY_SITE_ADDRESS in .env}
      CADDY_STORAGE_ADDRESS: ${CADDY_STORAGE_ADDRESS:?Set CADDY_STORAGE_ADDRESS in .env}
      MAX_PROXY_BODY_BYTES: ${MAX_PROXY_BODY_BYTES:-6291456}
      OBJECT_STORAGE_MAX_UPLOAD_BYTES: ${OBJECT_STORAGE_MAX_UPLOAD_BYTES:-536870912}
      OBJECT_STORAGE_MAX_UPLOAD_DURATION_SECONDS: ${OBJECT_STORAGE_MAX_UPLOAD_DURATION_SECONDS:-900}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - -w
        - "2"
        - 127.0.0.1
        - "2019"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - edge
      - web
      - ssh_web
      - objects

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ACCESS_LOG: "-"
      API_BASE_URL: http://api:8080
      API_EMAIL_TIMEOUT_SECONDS: ${BACKEND_EMAIL_API_TIMEOUT_SECONDS:-20}
      API_TIMEOUT_SECONDS: ${BACKEND_API_TIMEOUT_SECONDS:-5}
      API_STORAGE_TIMEOUT_SECONDS: ${BACKEND_STORAGE_API_TIMEOUT_SECONDS:-60}
      API_TRANSITION_TIMEOUT_SECONDS: ${BACKEND_TRANSITION_API_TIMEOUT_SECONDS:-65}
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:?Set BACKEND_SERVICE_TOKEN in .env}
      BROWSER_SESSION_COOKIE_NAME: ${BROWSER_SESSION_COOKIE_NAME:-ctfzone_browser_session}
      BROWSER_SESSION_COOKIE_SECURE: ${BROWSER_SESSION_COOKIE_SECURE:-true}
      BROWSER_SESSION_LIFETIME_SECONDS: ${BROWSER_SESSION_LIFETIME_SECONDS:-604800}
      ERROR_LOG: "-"
      MAX_PROXY_BODY_BYTES: ${MAX_PROXY_BODY_BYTES:-6291456}
      OBJECT_STORAGE_PUBLIC_URL: ${CADDY_STORAGE_ADDRESS:?Set CADDY_STORAGE_ADDRESS in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      THREADS: ${BACKEND_THREADS:-4}
      TIMEOUT: ${BACKEND_WORKER_TIMEOUT_SECONDS:-75}
      WORKERS: ${BACKEND_WORKERS:-2}
    expose:
      - "8000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - web
      - application

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      CTFZONE_API_BIND: 0.0.0.0:8080
      API_SIGNING_KEY: ${API_SIGNING_KEY:?Set API_SIGNING_KEY in .env}
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:?Set BACKEND_SERVICE_TOKEN in .env}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?Set CADDY_SITE_ADDRESS in .env}
      DATABASE_MAX_CONNECTIONS: ${API_DATABASE_MAX_CONNECTIONS:-10}
      DATABASE_URL: postgres://${POSTGRES_USER:-ctfzone}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ctfzone}
      EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS:-1800}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in .env}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-ctfzone}
      OBJECT_STORAGE_INTERNAL_URL: http://storage:8333
      OBJECT_STORAGE_MAX_UPLOAD_BYTES: ${OBJECT_STORAGE_MAX_UPLOAD_BYTES:-536870912}
      OBJECT_STORAGE_MAX_PENDING_OBJECTS_PER_PRINCIPAL: ${OBJECT_STORAGE_MAX_PENDING_OBJECTS_PER_PRINCIPAL:-8}
      OBJECT_STORAGE_MAX_PENDING_BYTES_PER_PRINCIPAL: ${OBJECT_STORAGE_MAX_PENDING_BYTES_PER_PRINCIPAL:-1073741824}
      OBJECT_STORAGE_MAX_RETAINED_BYTES_PER_PRINCIPAL: ${OBJECT_STORAGE_MAX_RETAINED_BYTES_PER_PRINCIPAL:-10737418240}
      OBJECT_STORAGE_MAX_UPLOADS_PER_HOUR_PER_PRINCIPAL: ${OBJECT_STORAGE_MAX_UPLOADS_PER_HOUR_PER_PRINCIPAL:-60}
      OBJECT_STORAGE_PUBLIC_URL: ${CADDY_STORAGE_ADDRESS:?Set CADDY_STORAGE_ADDRESS in .env}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in .env}
      PRESIGNED_URL_TTL_SECONDS: ${PRESIGNED_URL_TTL_SECONDS:-900}
      RUST_LOG: ${RUST_LOG:-ctfzone_api=info,tower_http=info}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
      SESSION_LIFETIME_SECONDS: ${BROWSER_SESSION_LIFETIME_SECONDS:-604800}
      SSH_GATEWAY_SERVICE_TOKEN: ${SSH_GATEWAY_SERVICE_TOKEN:?Set SSH_GATEWAY_SERVICE_TOKEN in .env}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - application
      - ssh_control
      - data
      - objects
      - egress

  ssh-gateway:
    build:
      context: .
      dockerfile: services/ssh-gateway/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      API_BASE_URL: http://api:8080
      CTFZONE_SSH_GATEWAY_BIND: 0.0.0.0:8091
      RUST_LOG: ${SSH_GATEWAY_RUST_LOG:-ctfzone_ssh_gateway=info,tower_http=info}
      SSH_ALLOWED_CIDRS: ${SSH_ALLOWED_CIDRS:?Set SSH_ALLOWED_CIDRS in .env}
      SSH_ALLOWED_ORIGINS: ${CADDY_SITE_ADDRESS:?Set CADDY_SITE_ADDRESS in .env}
      SSH_ALLOWED_PORTS: ${SSH_ALLOWED_PORTS:-22}
      SSH_GATEWAY_SERVICE_TOKEN: ${SSH_GATEWAY_SERVICE_TOKEN:?Set SSH_GATEWAY_SERVICE_TOKEN in .env}
      SSH_IDENTITY_DIRECTORY: /var/lib/ctfzone-ssh-gateway/identities
      SSH_IDLE_TIMEOUT_SECONDS: ${SSH_IDLE_TIMEOUT_SECONDS:-600}
      SSH_MAX_SESSION_SECONDS: ${SSH_MAX_SESSION_SECONDS:-1800}
    expose:
      - "8091"
    volumes:
      - ssh_gateway_identities:/var/lib/ctfzone-ssh-gateway/identities
    tmpfs:
      - /tmp:uid=10003,gid=10003,mode=1777
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ssh_web
      - ssh_control
      - egress

  controller:
    build:
      context: .
      dockerfile: services/controller/Dockerfile
    restart: unless-stopped
    environment:
      CTFZONE_CONTROLLER_BIND: 0.0.0.0:8090
      DATABASE_URL: postgres://${POSTGRES_USER:-ctfzone}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ctfzone}
      JOURNAL_PATH: /var/lib/ctfzone-controller/operations.jsonl
      MAX_COMMAND_ATTEMPTS: ${MAX_COMMAND_ATTEMPTS:-8}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in .env}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-ctfzone}
      OBJECT_STORAGE_INTERNAL_URL: http://storage:8333
      OBJECT_MAINTENANCE_INTERVAL_SECONDS: ${OBJECT_MAINTENANCE_INTERVAL_SECONDS:-30}
      OBJECT_MAINTENANCE_MAX_ATTEMPTS: ${OBJECT_MAINTENANCE_MAX_ATTEMPTS:-8}
      OBJECT_MAINTENANCE_STALE_CLAIM_SECONDS: ${OBJECT_MAINTENANCE_STALE_CLAIM_SECONDS:-300}
      OBJECT_STORAGE_MAX_UPLOAD_DURATION_SECONDS: ${OBJECT_STORAGE_MAX_UPLOAD_DURATION_SECONDS:-900}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in .env}
      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-300}
      REMOTE_DRIVER: ${CONTROLLER_REMOTE_DRIVER:-ssh}
      REMOTE_OPERATION_TIMEOUT_SECONDS: ${REMOTE_OPERATION_TIMEOUT_SECONDS:-60}
      SSH_IDENTITY_FILE: /etc/ctfzone/ssh/id_ed25519
      SSH_KNOWN_HOSTS_FILE: /etc/ctfzone/ssh/known_hosts
      STALE_CLAIM_AFTER_SECONDS: ${STALE_CLAIM_AFTER_SECONDS:-300}
    expose:
      - "8090"
    volumes:
      - controller_journal:/var/lib/ctfzone-controller
      - ./secrets:/etc/ctfzone/ssh:ro
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - data
      - objects
      - egress

  storage:
    image: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - mini
      - -dir=/data
      - -master.telemetry=false
      - -admin.ui=false
      - -webdav=false
      - -s3.iam=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -s3.concurrentFileUploadLimit=${OBJECT_STORAGE_UPLOAD_CONCURRENCY:-16}
      - -s3.concurrentUploadLimitMB=${OBJECT_STORAGE_CONCURRENT_UPLOAD_MB:-2048}
      - -filer.disableDirListing=true
      - -filer.exposeDirectoryData=false
      - -bucket=${OBJECT_STORAGE_BUCKET:-ctfzone}
      - -s3.allowedOrigins=${CADDY_SITE_ADDRESS:?Set CADDY_SITE_ADDRESS in .env}
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in .env}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET:-ctfzone}
    expose:
      - "8333"
    volumes:
      - object_storage_data:/data
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 3 http://127.0.0.1:9333/cluster/status >/dev/null &&
          curl -sS --max-time 3 --output /dev/null http://127.0.0.1:8333/
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - objects

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctfzone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-ctfzone}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc
          "SELECT 1 FROM ctfzone.release_metadata
          WHERE key='schema_version' AND value='1.0.0'
          AND EXISTS (
              SELECT 1 FROM ctfzone.release_metadata
              WHERE key='install_complete' AND value='1.0.0'
          )
          AND to_regclass('ctfzone.users') IS NOT NULL
          AND to_regclass('ctfzone.challenges') IS NOT NULL
          AND to_regclass('ctfzone.flags') IS NOT NULL
          AND to_regclass('ctfzone.challenge_categories') IS NOT NULL
          AND to_regclass('ctfzone.pages') IS NOT NULL
          AND EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='pages_system_identity_check'
              AND conrelid='ctfzone.pages'::regclass
          )
          AND EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='pages_visibility_check'
              AND conrelid='ctfzone.pages'::regclass
          )
          AND (
              SELECT count(*) = 3 FROM ctfzone.pages
              WHERE system_key IN ('home','challenges','scoreboard')
          )
          AND (
              SELECT count(*) = 3
              FROM information_schema.columns
              WHERE table_schema='ctfzone'
              AND table_name='challenge_categories'
              AND column_name IN ('logo_key','logo_color','icon_object_id')
          )
          AND EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='challenge_categories_logo_key_check'
              AND conrelid='ctfzone.challenge_categories'::regclass
          )
          AND EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='challenge_categories_logo_color_check'
              AND conrelid='ctfzone.challenge_categories'::regclass
          )
          AND to_regclass('ctfzone.runtime_instances') IS NOT NULL
          AND to_regclass('ctfzone.runtime_commands') IS NOT NULL
          AND to_regclass('ctfzone.remote_servers') IS NOT NULL
          AND to_regclass('ctfzone.ssh_hosts') IS NOT NULL
          AND to_regclass('ctfzone.ssh_host_identity_operations') IS NOT NULL
          AND to_regclass('ctfzone.ssh_host_tickets') IS NOT NULL
          AND to_regclass('ctfzone.email_verification_tokens') IS NOT NULL
          AND to_regclass('ctfzone.stored_objects') IS NOT NULL
          AND EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='stored_objects_category_icon_ready_check'
              AND conrelid='ctfzone.stored_objects'::regclass
          )
          AND EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname='stored_objects_validate_attached_category_icon'
              AND tgrelid='ctfzone.stored_objects'::regclass
              AND NOT tgisinternal
          )
          AND to_regclass('ctfzone.object_operations') IS NOT NULL"
          | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - data

networks:
  edge:
  web:
    internal: true
  application:
    internal: true
  ssh_control:
    internal: true
  ssh_web:
    internal: true
  data:
    internal: true
  objects:
    internal: true
  egress:

volumes:
  caddy_config:
  caddy_data:
  controller_journal:
  ssh_gateway_identities:
  object_storage_data:
  postgres_data:
