name: CTFZone CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86.0"
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  backend:
    name: Python BFF
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run BFF tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Check remote helper Python
        working-directory: .
        run: python -m py_compile remote-helper/ctfzone-runtime-helper

      - name: Run remote helper tests
        working-directory: .
        run: python -m unittest remote-helper/test_runtime_helper.py -v

      - name: Check remote helper installer
        working-directory: .
        run: sh -n remote-helper/install.sh

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    env:
      API_SIGNING_KEY: compose-check-api-signing-key
      BACKEND_SERVICE_TOKEN: compose-check-backend-token
      CADDY_SITE_ADDRESS: https://ctf.example.test
      CADDY_STORAGE_ADDRESS: https://files.ctf.example.test
      OBJECT_STORAGE_ACCESS_KEY: compose-check-storage-access
      OBJECT_STORAGE_SECRET_KEY: compose-check-storage-secret
      POSTGRES_PASSWORD: compose-check-only
      SECRET_KEY: compose-check-browser-key
      SETUP_TOKEN: compose-check-setup-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate production configuration
        run: docker compose -f compose.yml config --quiet

      - name: Validate local configuration
        run: docker compose -f compose.yml -f compose.local.yml config --quiet
