{% macro render(key, color='#34689c', class_name='category-built-in-logo') -%}

  {% elif key == 'pwn' %}
    <svg class="{{ class_name }}" viewBox="0 0 24 24" stroke="{{ color }}" aria-hidden="true" focusable="false" data-category-logo="pwn"><path d="M6 10a6 6 0 0 1 12 0v4l-2 2v3h-3v-2h-2v2H8v-3l-2-2z"/><circle cx="9.5" cy="11" r="1"/><circle cx="14.5" cy="11" r="1"/><path d="m12 13-1 2h2zM8 4 6 2m10 2 2-2"/></svg>
  {% elif key == 'crypto' %}
